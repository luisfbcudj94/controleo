<section class="register-grid">
	<form class="form-layout" [formGroup]="form" (ngSubmit)="save()">
		<div class="form-col">
			<article class="f-card">
				<div class="f-card-header">
					<div class="fch-icon" style="background: var(--inf2)">📅</div>
					<div class="fch-title">Fecha del gasto</div>
				</div>

				<div class="f-body">
					<div class="f-row single">
						<div class="f-field">
							<label class="f-label">Fecha exacta</label>
							<app-custom-date-input formControlName="date" />
						</div>
					</div>
				</div>
			</article>

			<article class="f-card">
				<div class="f-card-header">
					<div class="fch-icon" style="background: var(--ac2)">💵</div>
					<div class="fch-title">Valor del gasto</div>
				</div>

				<div class="amount-hero">
					<div class="ah-sym">$</div>
					<div class="ah-wrap">
						<input class="ah-input" type="number" formControlName="amount" min="0" placeholder="0" (focus)="onAmountFocus($event)" (blur)="onAmountBlur($event)" />
						<div class="ah-under"></div>
					</div>
				</div>
			</article>

			<article class="f-card">
				<div class="f-card-header">
					<div class="fch-icon" style="background: var(--pur2)">✏️</div>
					<div class="fch-title">Detalle del gasto</div>
				</div>

				<div class="f-body">
					<div class="f-row single">
						<div class="f-field">
							<label class="f-label">Descripción</label>
							<input class="f-input" type="text" formControlName="description" placeholder="¿En qué gastaste?" />
						</div>
					</div>

					<div class="f-row">
						<div class="f-field">
							<label class="f-label">Tipo de movimiento</label>
							<button class="f-input selector-trigger tile-trigger" type="button" (click)="openMovementTypeSelector()">{{ movementTypeSelectionLabel }}</button>
						</div>

						<div class="f-field">
							<label class="f-label">Medio de pago</label>
							<button class="f-input selector-trigger tile-trigger" type="button" (click)="openPaymentMethodSelector()">{{ paymentMethodSelectionLabel }}</button>
						</div>
					</div>
				</div>
			</article>

			<button class="save-btn mobile-save" type="submit" [disabled]="isSaving || form.invalid">
				{{ isSaving ? 'Guardando...' : '✦  Guardar gasto' }}
			</button>
		</div>

		<div>
			<aside class="preview-card">
				<div class="pc-title">Vista previa</div>
				<div class="pc-amount" [style.color]="movementTypeColor">${{ amountPreview | number:'1.0-0' }}</div>
				<div class="pc-rows">
					<div class="pc-row">
						<span class="pc-key">Descripción</span>
						<span class="pc-val">{{ descriptionPreview }}</span>
					</div>
					<div class="pc-row">
						<span class="pc-key">Fecha</span>
						<span class="pc-val">{{ form.controls.date.value || '—' }}</span>
					</div>
					<div class="pc-row">
						<span class="pc-key">Tipo</span>
						<span class="pc-val" [style.color]="movementTypeColor">{{ movementTypePreview }}</span>
					</div>
					<div class="pc-row">
						<span class="pc-key">Medio de pago</span>
						<span class="pc-val">{{ paymentMethodPreview }}</span>
					</div>
				</div>

				<button class="save-btn" type="submit" [disabled]="isSaving || form.invalid">
					{{ isSaving ? 'Guardando...' : '✦  Guardar gasto' }}
				</button>
			</aside>
		</div>
	</form>

	<app-selector-modal
		[isOpen]="selectorOpen"
		[title]="selectorTitle"
		[optionItems]="selectorItems"
		[selectedValue]="selectorValue"
		mode="tiles"
		closeVariant="icon"
		(choose)="selectOption($event)"
		(close)="closeSelector()" />
</section>
